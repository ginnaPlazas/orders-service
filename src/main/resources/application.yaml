spring:
  application:
    name: orders-service

server:
  port: 8082
  
resilience4j:
  retry:
    instances:
      coverageService:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:

aws:
  region: us-east-1
  sqs:
    order-confirmed-queue-url: https://sqs.us-east-1.amazonaws.com/XXXXXXXXXXXX/pedido-confirmado-queue

coverage:
  base-url: http://127.0.0.1:8081
