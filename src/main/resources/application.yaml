spring:
  application:
    name: orders-service

server:
  port: ${SERVER_PORT:8082}

resilience4j:
  retry:
    instances:
      coverageService:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:

# Cómo se publica el evento PedidoConfirmado:
#   sqs -> directo a una cola (desarrollo local: Orders -> cola -> Notifications)
#   sns -> a un tópico que reparte a Notifications y a la Lambda del PDF (perfil aws)
events:
  publisher: ${EVENTS_PUBLISHER:sqs}

aws:
  region: ${AWS_REGION:us-east-1}
  sqs:
    order-confirmed-queue-url: ${ORDER_EVENTS_QUEUE_URL:https://sqs.us-east-1.amazonaws.com/XXXXXXXXXXXX/pedido-confirmado-queue}

coverage:
  base-url: ${COVERAGE_BASE_URL:http://127.0.0.1:8081}
